[package]
name = "goofychat"
version = "0.1.0"
edition = "2021"

[lib]
name = "goofychat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
opt-level = "s"
