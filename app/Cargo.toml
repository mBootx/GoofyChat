[package]
name = "goofychat-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
proto = { path = "../proto" }
dioxus = { version = "0.7", default-features = false, features = ["launch", "web", "macro", "html", "signals", "hooks", "mounted"] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
futures-channel = "0.3"
futures-util = "0.3"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = "s"
lto = true
