[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
proto = { path = "../proto" }
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
# rustls only: the runtime image has no OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
chacha20poly1305 = "0.10"
md-5 = "0.10"
# Avatars, banners and story photos: validation and the still of animated avatars.
image = { version = "0.25", default-features = false, features = ["gif", "webp", "png", "jpeg"] }
# Local time of the stories worker (archive hours), from /etc/localtime.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "story-worker"
path = "src/bin/story-worker.rs"

[profile.release]
strip = true
